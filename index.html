<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 예산으로 서울 어디? — 서울 아파트 실거래가 탐색</title>
<meta name="description" content="예산과 조건으로 서울 25개 자치구의 아파트 실거래가를 탐색하는 대시보드">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <h1>내 예산으로 서울 어디?</h1>
  <p>서울시 아파트 실거래가 320,141건(2025.07~2026.06) 기반 · 호가가 아닌 실제 체결 거래만 보여줍니다</p>
</header>

<main class="layout">
  <aside class="filters-panel card" id="filters-panel">
    <h2>필터</h2>

    <div class="filter-group">
      <div class="filter-label">거래유형</div>
      <div class="segmented" id="deal-type-toggle">
        <button type="button" data-value="1" class="active">전세</button>
        <button type="button" data-value="2">월세</button>
        <button type="button" data-value="0">매매</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">
        <span>예산 (이 금액 이하)</span>
        <span class="budget-value" id="budget-value">3억</span>
      </div>
      <input type="range" id="budget-slider" min="0" max="1000" step="1">
      <div class="budget-input-row">
        <input type="number" id="budget-input" min="0" step="0.1">
        <span>억원</span>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">
        <span>면적 (평)</span>
        <span class="area-value" id="area-value">전체</span>
      </div>
      <div class="range-dual">
        <div class="range-track"></div>
        <div class="range-track-fill" id="area-track-fill"></div>
        <input type="range" id="area-min-slider" min="3" max="97" step="1" value="3">
        <input type="range" id="area-max-slider" min="3" max="97" step="1" value="97">
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">자치구 <span id="gu-selected-count"></span></div>
      <div class="chip-list" id="gu-chip-list">
        <button type="button" class="chip chip-all active" data-code="">전체</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">거래 시점</div>
      <div class="segmented" id="period-toggle">
        <button type="button" data-value="3">최근 3개월</button>
        <button type="button" data-value="6">최근 6개월</button>
        <button type="button" data-value="12" class="active">전체 12개월</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">층수</div>
      <label class="checkbox-row">
        <input type="checkbox" id="floor-exclude-checkbox">
        1층·반지하 제외
      </label>
    </div>

    <div class="filter-group">
      <button type="button" class="reset-btn" id="reset-filters">필터 초기화</button>
    </div>
  </aside>

  <section class="content">
    <div class="card map-card">
      <h2>서울 지도</h2>
      <div class="map-toolbar">
        <div class="map-toggle" id="map-metric-toggle">
          <button type="button" data-value="count" class="active">가능 매물 수</button>
          <button type="button" data-value="median">시세 중앙값</button>
        </div>
        <div id="map-loading-note" style="font-size:0.75rem;color:var(--neutral-50);"></div>
      </div>
      <div class="map-wrap">
        <svg id="seoul-map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="legend" id="map-legend"></div>
    </div>

    <div class="card summary-card" id="summary-card">
      <h2>요약</h2>
      <div id="summary-body"></div>
    </div>

    <div class="card list-card">
      <div class="list-header">
        <div class="list-count" id="list-count">조건에 맞는 거래를 불러오는 중...</div>
        <select class="sort-select" id="sort-select">
          <option value="priceAsc">금액 낮은순</option>
          <option value="priceDesc">금액 높은순</option>
          <option value="dateDesc">최신순</option>
          <option value="areaDesc">면적 넓은순</option>
        </select>
      </div>
      <div class="list-body" id="list-body">
        <div class="list-loading">실거래 데이터를 불러오는 중입니다...</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>
</main>

<div class="map-tooltip hidden" id="map-tooltip"></div>

<footer class="app-footer">
  데이터 출처: 서울열린데이터광장 서울시 부동산 실거래가 정보(OA-21275) · 2025.07~2026.06 · 호가·광고가 아닌 실제 체결 거래
</footer>

<script src="assets/app.js"></script>
</body>
</html>
